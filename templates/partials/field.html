<div>
  <label for="{{ field.id_for_label }}" class="text-sm font-semibold">{{ field.label }}</label>
  {{ field }}
  {% if field.help_text %}<p class="mt-1 text-xs text-slate-400">{{ field.help_text }}</p>{% endif %}
  {% for e in field.errors %}<p class="mt-1 text-xs font-medium text-red-600">{{ e }}</p>{% endfor %}
</div>
